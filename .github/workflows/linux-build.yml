name: Linux Build

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            clang \
            libclang-rt-dev \
            libcurl4-openssl-dev \
            git \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Restore Skia build cache
        id: skia_cache
        uses: actions/cache@v4
        with:
          path: third_party/skia
          key: linux-skia-${{ runner.arch }}-${{ hashFiles('ci/skia-revision.txt', 'build.sh') }}

      - name: Build Linux application with PDF support
        # Pin the second compiler toolchain as well as Cargo.lock.
        # No Rust runtime or Cargo is required by the packaged application.
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          if [ -f third_party/skia/out/Static/libskia.a ]; then
            ./build.sh --skip-skia --benchmarks
          else
            ./build.sh --benchmarks
          fi

      - name: Build unit tests
        run: cmake --build build --target mdviewer_tests mdviewer_benchmarks --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux release
        run: ./package-linux.sh --skip-build

      - name: Verify packaged archive
        run: |
          sha256sum --check dist/mdviewer-linux-x64.tar.gz.sha256
          rm -rf /tmp/mdviewer-release-test
          mkdir /tmp/mdviewer-release-test
          tar -xzf dist/mdviewer-linux-x64.tar.gz -C /tmp/mdviewer-release-test
          test -x /tmp/mdviewer-release-test/mdviewer-linux-x64/bin/mdviewer
          ! ldd /tmp/mdviewer-release-test/mdviewer-linux-x64/bin/mdviewer | grep -F "$GITHUB_WORKSPACE/build/"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdviewer-linux-x64
          path: |
            dist/mdviewer-linux-x64.tar.gz
            dist/mdviewer-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Configure sanitizer tests
        run: |
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSKIA_DIR="$PWD/third_party/skia" \
            -DSKIA_OUT_DIR="$PWD/third_party/skia/out/Static" \
            -DSKIA_DEBUG_OUT_DIR="$PWD/third_party/skia/out/Static" \
            -DMDVIEWER_ENABLE_PDF=ON \
            -DMDVIEWER_ENABLE_SANITIZERS=ON \
            -DMDVIEWER_BUILD_FUZZERS=ON

      - name: Build sanitizer tests
        run: cmake --build build-sanitizers --target mdviewer_tests mdviewer_markdown_fuzz mdviewer_svg_fuzz --parallel 2

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure


  publish-linux:
    needs: build-and-test-linux
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: mdviewer-linux-x64
          path: dist
      - name: Publish Linux GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/mdviewer-linux-x64.tar.gz
            dist/mdviewer-linux-x64.tar.gz.sha256
          generate_release_notes: true

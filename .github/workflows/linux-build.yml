name: Linux Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Build Linux application with PDF support
        run: ./build.sh

      - name: Build unit tests
        run: cmake --build build --target mdviewer_tests --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure sanitizer tests
        run: |
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSKIA_DIR="$PWD/third_party/skia" \
            -DSKIA_OUT_DIR="$PWD/third_party/skia/out/Static" \
            -DSKIA_DEBUG_OUT_DIR="$PWD/third_party/skia/out/Static" \
            -DMDVIEWER_ENABLE_PDF=ON \
            -DMDVIEWER_ENABLE_SANITIZERS=ON

      - name: Build sanitizer tests
        run: cmake --build build-sanitizers --target mdviewer_tests --parallel 2

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

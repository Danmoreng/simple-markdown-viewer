name: Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Resolve Skia bundle version
        shell: pwsh
        run: |
          $tag = (Get-Content "ci/skia-bundle-version.txt" -Raw).Trim()
          if (-not $tag) {
            throw "ci/skia-bundle-version.txt is empty."
          }
          "SKIA_BUNDLE_TAG=$tag" >> $env:GITHUB_ENV
          "SKIA_BUNDLE_ASSET=skia-windows-x64-static.zip" >> $env:GITHUB_ENV

      - name: Download prebuilt Skia bundle
        id: skia_bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetPath = "dist\$env:SKIA_BUNDLE_ASSET"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          gh release download $env:SKIA_BUNDLE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:SKIA_BUNDLE_ASSET --output $assetPath *> $null
          if ($LASTEXITCODE -eq 0 -and (Test-Path $assetPath)) {
            Remove-Item "third_party\skia" -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $assetPath -DestinationPath "." -Force
            $requiredBundleFiles = @(
              "third_party\skia\LICENSE",
              "third_party\skia\include\core\SkCanvas.h",
              "third_party\skia\modules\svg\include\SkSVGDOM.h",
              "third_party\skia\modules\skresources\include\SkResources.h",
              "third_party\skia\modules\skshaper\include\SkShaper.h",
              "third_party\skia\modules\skshaper\include\SkShaper_harfbuzz.h",
              "third_party\skia\modules\skunicode\include\SkUnicode.h",
              "third_party\skia\modules\skunicode\include\SkUnicode_icu.h",
              "third_party\skia\src\core\SkTHash.h",
              "third_party\skia\out\Static\skia.lib",
              "third_party\skia\out\Static\svg.lib",
              "third_party\skia\out\Static\skresources.lib",
              "third_party\skia\out\Static\skshaper.lib",
              "third_party\skia\out\Static\skunicode_core.lib",
              "third_party\skia\out\Static\skunicode_icu.lib",
              "third_party\skia\out\Static\harfbuzz.lib",
              "third_party\skia\out\Static\icu.lib",
              "third_party\skia\out\Static\expat.lib",
              "third_party\skia\out\Static\icudtl.dat",
              "third_party\skia\out\Static\SKIA_REVISION",
              "third_party\skia\out\Static\SKIA_MILESTONE",
              "third_party\skia\out\Static\SKIA_GN_ARGS"
            )
            $missingBundleFiles = @($requiredBundleFiles | Where-Object { -not (Test-Path $_ -PathType Leaf) })
            if ($missingBundleFiles.Count -eq 0) {
              $bundleGnArgs = Get-Content "third_party\skia\out\Static\SKIA_GN_ARGS" -Raw
              $requiredGnArgs = @(
                "skia_enable_ganesh=true",
                "skia_use_gl=false",
                "skia_use_direct3d=true",
                "skia_use_icu=true",
                "skia_enable_skunicode=true",
                "skia_use_harfbuzz=true",
                "skia_use_system_harfbuzz=false",
                "skia_enable_skshaper=true"
              )
              $missingGnArgs = @($requiredGnArgs | Where-Object { -not $bundleGnArgs.Contains($_) })
              $missingBundleFiles += @($missingGnArgs | ForEach-Object { "SKIA_GN_ARGS: $_" })
            }
            if ($missingBundleFiles.Count -eq 0) {
              "bundle_available=true" >> $env:GITHUB_OUTPUT
            } else {
              Write-Host "Downloaded Skia bundle is stale; missing required text-stack artifacts:" -ForegroundColor Yellow
              $missingBundleFiles | ForEach-Object { Write-Host "  $_" -ForegroundColor Yellow }
              Remove-Item "third_party\skia" -Recurse -Force -ErrorAction SilentlyContinue
              "bundle_available=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            "bundle_available=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Release
        shell: pwsh
        run: |
          if ("${{ steps.skia_bundle.outputs.bundle_available }}" -eq "true") {
            .\build.ps1 -SkipSkia -Configuration Release
          } else {
            Write-Host "Prebuilt Skia bundle not available; falling back to source build." -ForegroundColor Yellow
            .\build.ps1 -Configuration Release
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target mdviewer_tests
          if ($LASTEXITCODE -ne 0) { throw "mdviewer_tests build failed." }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows unit tests failed." }

      - name: Stage release files
        shell: pwsh
        run: |
          $stageDir = "dist\mdviewer-windows-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "build\Release\mdviewer.exe" "$stageDir\mdviewer.exe"
          if (-not (Test-Path "build\Release\icudtl.dat")) {
            throw "ICU runtime data is missing from the Windows build."
          }
          Copy-Item "build\Release\icudtl.dat" "$stageDir\icudtl.dat"
          if (-not (Test-Path "build\Release\res\.clatexmath-res_root")) {
            throw "MicroTeX runtime resources are missing from the Windows build."
          }
          Copy-Item "build\Release\res" "$stageDir\res" -Recurse
          Copy-Item "LICENSE" "$stageDir\LICENSE"
          Copy-Item "THIRD_PARTY_NOTICES" "$stageDir\THIRD_PARTY_NOTICES"
          if (Test-Path "README.md") {
            Copy-Item "README.md" "$stageDir\README.md"
          }

      - name: Archive release bundle
        shell: pwsh
        run: |
          $zipPath = "dist\mdviewer-windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "dist\mdviewer-windows-x64\*" -DestinationPath $zipPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdviewer-windows-x64
          path: dist/mdviewer-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/mdviewer-windows-x64.zip
          generate_release_notes: true
